[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fourdstem"
version = "0.1.0"
description = "General-purpose 4D-STEM processing and analysis (RDF/PDF, virtual imaging, NMF/PCA, Bragg masking, in-situ series)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jonghoon K." }]
keywords = ["4D-STEM", "electron microscopy", "PDF", "RDF", "NMF", "diffraction"]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# unsupervised decomposition (NMF/PCA) — also provides joblib for parallelism
ml = ["scikit-learn>=1.0"]
# parallel batch processing (multi-core) without pulling all of scikit-learn
parallel = ["joblib>=1.1", "tqdm>=4.60"]
# reading Gatan .dm4/.dm3 and other microscope formats
io = ["ncempy>=1.10", "hyperspy>=1.7"]
# quantitative scattering factors for the RDF pipeline
sf = ["abtem>=1.0"]
# plotting
viz = ["matplotlib>=3.4"]
# everything
all = [
    "scikit-learn>=1.0",
    "joblib>=1.1",
    "tqdm>=4.60",
    "ncempy>=1.10",
    "hyperspy>=1.7",
    "abtem>=1.0",
    "matplotlib>=3.4",
]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/matphyscope/4dstemtordf_v3"

[tool.setuptools.packages.find]
include = ["fourdstem*"]

[tool.setuptools.package-data]
fourdstem = ["analysis/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
